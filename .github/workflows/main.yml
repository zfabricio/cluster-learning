name: Cluster Learning Final
on: [push]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Ferramentas
        run: npm install -g tsx localtunnel

      - name: Lançar e Desconectar (Status Verde)
        run: |
          nohup tsx app.ts > cluster.log 2>&1 &
          
         
          sleep 5
          echo "------------------------------------------"
          echo "TUA PASSWORD DO TUNNEL:"
          curl -s https://loca.lt/mytunnelpassword
          echo -e "\n------------------------------------------"
          
         
          nohup lt --port 8000 > tunnel.log 2>&1 &
          disown -a
          
          sleep 5
          echo "TEU LINK PUBLICO:"
          cat tunnel.log
          echo "Processo finalizado com sucesso no GitHub. Link ativo no Runner."
          exit 0